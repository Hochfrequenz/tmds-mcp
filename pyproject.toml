[build-system]
requires = ["hatchling>=1.29.0", "hatch-vcs", "hatch-fancy-pypi-readme"]
build-backend = "hatchling.build"

[project]
name = "tmds-mcp"
dynamic = ["readme", "version"]
description = "MCP server for the Technical Master Data Service (TMDS) — read-only debug tools"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Hochfrequenz Unternehmensberatung GmbH", email = "info+pip@hochfrequenz.de" }]
keywords = ["tmds", "technicalmasterdata", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "tmdsclient>=0.7.1",
    "fastmcp>=3.0",
    "pydantic-settings>=2.7",
    "python-dotenv>=1.0",
]

[dependency-groups]
tests = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-mock==3.15.1",
]
linting = [
    "ruff==0.16.2",
    {include-group = "tests"},
]
type_check = [
    "mypy==2.3.0",
    {include-group = "tests"},
]
spell_check = [
    "codespell==2.4.2",
]
coverage = [
    "coverage==7.15.4",
    {include-group = "tests"},
]
dev = [
    {include-group = "tests"},
    {include-group = "linting"},
    {include-group = "type_check"},
    {include-group = "spell_check"},
    {include-group = "coverage"},
]

[tool.uv]
default-groups = []

[project.scripts]
tmds-mcp = "tmds_mcp.server:main"

[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"
fragments = [{ path = "README.md" }]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/tmds_mcp_version.py"
template = '''
version = "{version}"
'''

[tool.hatch.build.targets.wheel]
only-include = ["src"]
sources = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["unittests"]

[tool.ruff]
line-length = 120
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
    "B",
    "N",
    "PL",
    "RUF",
    "SIM",
    "C4",
    "PTH",
    "PT",
    "RET",
    "ARG",
    "TC",
    "PIE",
    "RSE",
    "ISC",
    "S",
]
ignore = [
    "PLR0913",  # too-many-arguments
    "PLR0917",  # too-many-positional-arguments
    "PLR0912",  # too-many-branches
    "PLR0915",  # too-many-statements
    "PLR2004",  # magic-value-comparison
    "ISC001",   # single-line-implicit-string-concatenation (conflicts with ruff format)
]

[tool.ruff.lint.isort]
known-first-party = ["tmds_mcp"]

[tool.ruff.lint.per-file-ignores]
# Standing globs (hand-written): cover files that do not exist yet.
"unittests/**" = [
    "S101",     # assert-used
    "PLR2004",  # magic-value-comparison
]
# Generated grandfathering for existing violations (zero lint churn); burn down over time.
"src/tmds_mcp/server.py" = [
    "PLC0415",  # import-outside-top-level
]
"unittests/test_server.py" = [
    "UP017",    # datetime-timezone-utc
]

[tool.mypy]
disable_error_code = []
